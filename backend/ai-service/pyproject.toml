[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "base-architecture-ai-service"
version = "0.1.0"
description = "Internal AI analysis service for Base Architecture Starter"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.139.2,<0.140.0",
    "pydantic>=2.12.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "pytest>=8.4.0,<10.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
