name: base-architecture

services:
  ai-service:
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile
    init: true
    expose:
      - "8000"

  core-api:
    build:
      context: ../backend/core-api
      dockerfile: Dockerfile
    init: true
    environment:
      AI_SERVICE_BASE_URL: http://ai-service:8000
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    init: true
    working_dir: /app
    command:
      - sh
      - -c
      - pnpm install --frozen-lockfile && exec pnpm dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_CORE_API_BASE_URL: /
      VITE_DEV_PROXY_TARGET: http://core-api:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../frontend:/app
      - web-node-modules:/app/node_modules

volumes:
  web-node-modules:
